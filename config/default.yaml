# Default configuration file
openmrs:
  base_url: "${OPENMRS_URL}"
  username: "${OPENMRS_USERNAME}"
  password: "${OPENMRS_PASSWORD}"
  api:
    person_endpoint: "/ws/rest/v1/person"
    patient_endpoint: "/ws/rest/v1/patient"
    default_params:
      v: "full"

dhis2:
  base_url: "${DHIS2_URL}"
  api_token: "${DHIS2_API_TOKEN}"
  api:
    tracked_entity_endpoint: "/api/trackedEntityInstances"
    program_endpoint: "/api/programs"
    org_unit_endpoint: "/api/organisationUnits"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"

spark:
  master: "${SPARK_MASTER}"
  app_name: "HealthDataInteroperability"
  config:
    spark.executor.memory: "2g"
    spark.driver.memory: "2g"

temp_data:
  base_path: "./include/temp_data"
  file_prefix: "patients"
