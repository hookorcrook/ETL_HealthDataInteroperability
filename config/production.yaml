# Production environment configuration
openmrs:
  base_url: "${OPENMRS_URL}"
  username: "${OPENMRS_USERNAME}"
  password: "${OPENMRS_PASSWORD}"
  api:
    person_endpoint: "/ws/rest/v1/person"
    patient_endpoint: "/ws/rest/v1/patient"
    default_params:
      v: "full"
    retry:
      max_attempts: 3
      backoff_factor: 2
      timeout: 30

dhis2:
  base_url: "${DHIS2_URL}"
  api_token: "${DHIS2_API_TOKEN}"
  api:
    tracked_entity_endpoint: "/api/trackedEntityInstances"
    program_endpoint: "/api/programs"
    org_unit_endpoint: "/api/organisationUnits"
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    retry:
      max_attempts: 3
      backoff_factor: 2
      timeout: 30

spark:
  master: "${SPARK_MASTER}"  # Production uses cluster manager
  app_name: "HealthDataInteroperability-Prod"
  config:
    spark.executor.memory: "4g"
    spark.driver.memory: "4g"
    spark.executor.cores: "2"
    spark.sql.shuffle.partitions: "10"
    spark.default.parallelism: "20"
    spark.speculation: "true"
    spark.memory.fraction: "0.8"

temp_data:
  base_path: "./include/temp_data"
  file_prefix: "patients"
  cleanup: true
  retention_days: 7  # Keep temp files for 7 days in production

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/production.log"
  rotation: "midnight"
  backup_count: 30  # Keep 30 days of logs
  
monitoring:
  enable_metrics: true
  prometheus_port: 9090
  alert_email: "${ALERT_EMAIL}"
  error_threshold: 5  # Alert after 5 consecutive errors
