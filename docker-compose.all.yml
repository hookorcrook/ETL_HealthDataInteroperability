x-airflow-common: &airflow-common
  build: .
  image: etl-airflow:2.8.1-python3.9
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__DATABASE__RESET_DB: "true"
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # OpenMRS Configuration
    OPENMRS_URL: ${OPENMRS_URL}
    OPENMRS_USERNAME: ${OPENMRS_USERNAME}
    OPENMRS_PASSWORD: ${OPENMRS_PASSWORD}
    # DHIS2 Configuration
    DHIS2_URL: ${DHIS2_URL}
    DHIS2_API_TOKEN: ${DHIS2_API_TOKEN}
    # Application Configuration
    TEMP_DATA_PATH: /opt/airflow/include/temp_data
    # Spark Configuration
    SPARK_MASTER: ${SPARK_MASTER}
    SPARK_DEPLOY_MODE: ${SPARK_DEPLOY_MODE}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY}
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
    SPARK_NAMESPACE: ${SPARK_NAMESPACE}
  volumes:
    - "${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags"
    - "${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs"
    - "${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config"
    - "${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins"
    - "${AIRFLOW_PROJ_DIR:-.}/include:/opt/airflow/include"
    - "${AIRFLOW_PROJ_DIR:-.}/apps:/opt/airflow/apps"
    - "${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts"
  networks:
    - shared-network

services:
  # Airflow Services
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    expose:
      - 6379
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins}
        airflow db reset -y && \
        airflow db init && \
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com \
          --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''

  # Spark Services
  spark-master:
    image: bitnami/spark:3.5.0-debian-11-r0
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_WEBUI_PORT=8081
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_DRIVER_MEMORY=1g
      - SPARK_EXECUTOR_MEMORY=1g
    ports:
      - "8085:8081"
      - "7077:7077"
    volumes:
      - spark-data:/bitnami
      - ${AIRFLOW_PROJ_DIR:-.}/include:/opt/airflow/include
      - ${AIRFLOW_PROJ_DIR:-.}/apps:/opt/spark-apps
    networks:
      - shared-network

  # OpenMRS Services
  openmrs-db:
    image: mysql:5.6
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci"
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin123}
      MYSQL_USER: ${MYSQL_USER:-openmrs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Admin123}
    ports:
      - "3306:3306"
    volumes:
      - openmrs-mysql-data:/var/lib/mysql
    networks:
      - shared-network

  openmrs:
    image: openmrs/openmrs-reference-application-distro:demo
    depends_on:
      - openmrs-db
    ports:
      - "8081:8080"
    environment:
      DB_DATABASE: ${MYSQL_DB:-openmrs}
      DB_HOST: openmrs-db
      DB_USERNAME: ${MYSQL_USER:-openmrs}
      DB_PASSWORD: ${MYSQL_PASSWORD:-Admin123}
      DB_CREATE_TABLES: 'true'
      DB_AUTO_UPDATE: 'true'
      MODULE_WEB_ADMIN: 'true'
    volumes:
      - openmrs-data:/usr/local/tomcat/.OpenMRS
    networks:
      - shared-network

  # DHIS2 Services
  dhis2:
    image: "dhis2/core:2.41.4.2-rc"
    ports:
      - "8082:8080"
    volumes:
      - ./HMISTools/DHIS2/docker/dhis.conf:/opt/dhis2/dhis.conf:ro
      - ./HMISTools/DHIS2/docker/log4j2.xml:/opt/dhis2/log4j2.xml:ro
    environment:
      JAVA_OPTS: "-Xmx2048m -Xms512m"
    networks:
      - shared-network

volumes:
  postgres-db-volume:
  spark-data:
  openmrs-mysql-data:
  openmrs-data:

networks:
  shared-network:
    name: shared-network
    external: true
